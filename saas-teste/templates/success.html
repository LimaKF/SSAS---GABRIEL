<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Aprovado - Gateway SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 text-center border border-slate-700">
        
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-emerald-500/10 mb-6">
            <svg class="h-10 w-10 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-bold text-white mb-2">Pagamento Aprovado!</h1>
        <p class="text-slate-400 text-sm mb-8">Sua transação foi processada com sucesso. O recibo e os detalhes foram enviados para o seu e-mail.</p>

        <div class="bg-slate-900 rounded-xl p-5 text-left mb-8 border border-slate-700">
            <div class="flex justify-between items-center mb-3">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">Valor Pago</span>
                <span class="text-emerald-400 font-bold text-lg">R$ 99,90</span>
            </div>
            <div class="flex justify-between items-center mb-3">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">Status</span>
                <span class="bg-emerald-500/20 text-emerald-400 py-1 px-2 rounded text-xs font-semibold">Concluído</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">ID da Transação</span>
                <span class="text-slate-300 text-xs font-mono">#TXN-8472910</span>
            </div>
        </div>

        <a href="/" class="block w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20">
            Acessar meu Dashboard
        </a>
        
        <p class="mt-6 text-xs text-slate-500">
            Dúvidas? <a href="#" class="text-emerald-500 hover:underline">Fale com o suporte</a>.
        </p>

    </div>

</body>
</html>
